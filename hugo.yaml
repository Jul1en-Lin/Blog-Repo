baseURL: https://Jul1en-Lin.github.io
title: Jul1en
copyright: Jul1en
defaultContentLanguage: zh-cn
hasCJKLanguage: true
timeout: 300s

languages:
  zh-cn:
    locale: zh-CN
    label: 中文
    title: Jul1en
    weight: 1

pagination:
  pagerSize: 6

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  brandName: Jul1en
  description: 一个关于后端开发、测试、工具实践与生活记录的个人博客。
  mainSections:
    - post
  primaryNav:
    - identifier: blog
      name: Blog
      url: /post/
      section: post
    - identifier: search
      name: Search
      url: /search/
    - identifier: music
      name: Music
      url: /music/
  featuredImageField: image
  rssFullContent: true
  dateFormat:
    published: 2006-01-02
    lastUpdated: 2006-01-02
  article:
    toc: true
  opengraph:
    twitter:
      card: summary_large_image
  defaultImage:
    opengraph:
      enabled: false
      local: false
      src:
  colorScheme:
    toggle: true
    default: light
  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

menu:
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/Jul1en-Lin
      params:
        icon: brand-github
    - identifier: instagram
      name: Instagram
      url: https://www.instagram.com/jul1en_lin
      params:
        icon: brand-instagram

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1
    endLevel: 4
    ordered: true
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    tabWidth: 4

frontmatter:
  lastmod:
    - :git
    - :fileModTime

enableGitInfo: true
