<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}" dir="{{ default `ltr` .Language.Direction }}">

<head>
    {{- partial "head/head.html" . -}}
    {{- block "head" . -}}{{ end }}
</head>

<body class="melody-shell {{ block `body-class` . }}{{ end }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{- partial "site-header.html" . -}}
    {{- partial "plum-background.html" . -}}

    <main id="main-content" class="main main-content full-width" tabindex="-1">
        {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer/site-tools.html" . -}}
    {{- partial "footer/mermaid.html" . -}}
</body>

</html>
