{{- $tocManuallyDisabled := or (eq .Params.toc false) (eq .Params.toc "false") -}}
{{- $tocEnabled := and (not $tocManuallyDisabled) (default true .Site.Params.article.toc) (ge (len .TableOfContents) 100) -}}
{{- if $tocEnabled -}}
<aside class="article-detail__toc-rail" aria-label="文章目录" data-article-toc>
    <button class="article-detail__toc-toggle" type="button" aria-label="显示文章目录" aria-controls="TableOfContents" aria-expanded="false" data-article-toc-toggle>
        <span class="article-detail__toc-toggle-line" aria-hidden="true"></span>
        <span class="article-detail__toc-toggle-line" aria-hidden="true"></span>
        <span class="article-detail__toc-toggle-line" aria-hidden="true"></span>
    </button>

    <div class="article-detail__toc-panel" data-article-toc-panel aria-hidden="true">
        <div class="article-detail__toc-nav" data-article-toc-nav>
            {{ .TableOfContents }}
        </div>
    </div>
</aside>
{{- end -}}
