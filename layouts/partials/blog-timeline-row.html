{{- $page := . -}}

<article class="post-timeline__item">
    <a class="post-timeline__link" href="{{ $page.RelPermalink }}">
        <span class="post-timeline__title">{{ $page.Title }}</span>

        <span class="post-timeline__meta">
            {{- if not $page.Date.IsZero -}}
            <time datetime="{{ $page.Date.Format `2006-01-02T15:04:05Z07:00` }}">{{ $page.Date | time.Format (or $page.Site.Params.dateFormat.published "2006-01-02") }}</time>
            {{- end -}}
            <span>{{ $page.ReadingTime }}min</span>
        </span>
    </a>
</article>
